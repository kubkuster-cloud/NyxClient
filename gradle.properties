# Done to run Gradle in offline-friendly, memory safe mode
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# Pulled live from meta.fabricmc.net / maven.fabricmc.net on 2026-08-22. Re-check against
# https://fabricmc.net/develop if the build fails to resolve them - these are re-cut often.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.3

# Mod Properties
# major.minor only - build.gradle appends the patch from the .build-number counter, so the full
# version climbs 0.1.0, 0.1.1, 0.1.2 with each jar built. Bump this by hand for a real release.
mod_version=0.1
maven_group=com.nyxclient
archives_base_name=nyxclient

# Dependencies
fabric_version=0.119.4+1.21.4
