plugins {
	id 'fabric-loom' version '1.10.5'
	id 'maven-publish'
}

// Every build gets its own jar filename, so a new jar dropped into .minecraft/mods can never be
// mistaken for - or silently overwrite - the previous one. The counter lives in an untracked file
// rather than in gradle.properties on purpose: bumping a tracked file would leave the working tree
// dirty after every single build, and the number is a local fact about this machine, not something
// worth carrying in history. mod_version stays the real version and is still bumped by hand.
def buildNumberFile = file('.build-number')
def buildNumber = buildNumberFile.exists() ? (buildNumberFile.text.trim() as Integer) : 1

version = "${project.mod_version}+build.${buildNumber}"
group = project.maven_group

// Bumps only after a jar is actually produced, so read-only invocations (gradlew tasks, IDE syncs)
// leave the counter alone.
def bumpBuildNumber = tasks.register('bumpBuildNumber') {
	doLast {
		buildNumberFile.text = (buildNumber + 1).toString()
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories here if you need to depend on other mods.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.named('remapJar') {
	finalizedBy bumpBuildNumber
}
